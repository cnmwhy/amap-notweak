name: Build Tweak (deb)
on:
  push:
    paths: ['theos/**', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install roothide theos (non-root)
        run: |
          sudo -u runner bash -c 'bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"'
      - name: Build roothide deb
        run: |
          sudo -u runner bash -c 'cd theos && THEOS=/Users/runner/theos THEOS_PACKAGE_SCHEME=roothide make package'
      - uses: actions/upload-artifact@v4
        with:
          name: AmapNoTweak-deb
          path: theos/packages/*.deb
          if-no-files-found: error
